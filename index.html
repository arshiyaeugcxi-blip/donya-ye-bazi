
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>دنیای بازی</title>
<style>
body {
  margin: 0;
  background: #1b1a23;
  color: white;
  font-family: Tahoma, sans-serif;
}
header {
  padding: 20px;
  display: flex;
  justify-content: space-between;
  color: #36e8bf;
}
nav {
  display: flex;
  position: fixed;
  bottom: 0;
  width: 100%;
  background: #292733;
}
nav button { flex: 1; }
main { padding: 15px 15px 90px; max-width: 700px; margin: auto; }
.card {
  background: #302e3b;
  border: 1px solid #454151;
  border-radius: 18px;
  padding: 18px;
  margin: 12px 0;
}
button {
  background: #7554d7;
  color: white;
  border: 0;
  border-radius: 12px;
  padding: 12px;
  margin: 5px 0;
  cursor: pointer;
}
input, select, textarea {
  display: block;
  box-sizing: border-box;
  width: 100%;
  padding: 12px;
  margin: 10px 0;
  border-radius: 10px;
  background: #201f29;
  color: white;
  border: 1px solid #555;
}
.page { display: none; }
.page.active { display: block; }
.note { color: #36e8bf; line-height: 2; }
</style>
</head>
<body>
<header>
  <b>🎮 دنیای بازی</b>
  <span>🪙 <span id="coins">500</span> سکه</span>
</header>

<main>
<section id="home" class="page active">
  <div class="card">
    <h2>به دنیای بازی خوش آمدی!</h2>
    <p>بازی کن و سکه جمع کن.</p>
    <button onclick="play()">شروع بازی</button>
    <p id="gameResult"></p>
  </div>
</section>

<section id="shop" class="page">
  <div class="card">
    <h2>🛍️ فروشگاه جم</h2>
    <p>۲۰۰ جم — ۲۰۰ سکه</p>
    <button onclick="buy(200,200)">خرید ۲۰۰ جم</button>
    <p>۵۰۰ جم — ۴۰۰ سکه</p>
    <button onclick="buy(500,400)">خرید ۵۰۰ جم</button>
    <p>۱۰۰۰ جم — ۷۰۰ سکه</p>
    <button onclick="buy(1000,700)">خرید ۱۰۰۰ جم</button>
    <p id="shopResult"></p>
  </div>
</section>

<section id="support" class="page">
  <div class="card">
    <h2>پروفایل کاربری</h2>
    <input id="first" placeholder="نام (اجباری)">
    <input id="last" placeholder="نام خانوادگی">
    <input id="rubika" placeholder="آیدی روبیکا">
    <button onclick="saveProfile()">ذخیره پروفایل</button>
    <p id="profileResult"></p>
  </div>
  <div class="card">
    <h2>تماس با تیم پشتیبانی</h2>
    <select id="kind">
      <option>خرید جم</option>
      <option>مشکل بازی</option>
      <option>مشکل سکه</option>
      <option>مشکل حساب کاربری</option>
      <option>سایر موارد</option>
    </select>
    <textarea id="details" placeholder="توضیحات درخواست"></textarea>
    <button onclick="sendRequest()">ثبت درخواست</button>
    <p id="requestResult"></p>
  </div>
</section>

<section id="settings" class="page">
  <div class="card">
    <h2>⚙️ تنظیمات پروفایل</h2>
    <p id="summary">پروفایل هنوز ذخیره نشده است.</p>
    <button onclick="show('support')">ویرایش پروفایل</button>
  </div>
  <div class="card">
    <h2>🔐 ورود پشتیبانی آزمایشی</h2>
    <input id="password" type="password" placeholder="رمز پشتیبانی">
    <button onclick="adminLogin()">ورود</button>
    <p id="adminResult"></p>
    <div id="inbox"></div>
  </div>
</section>
</main>

<nav>
  <button onclick="show('home')">🏠 خانه</button>
  <button onclick="show('shop')">🛍️ فروشگاه</button>
  <button onclick="show('support')">☎️ پشتیبانی</button>
  <button onclick="show('settings')">⚙️ تنظیمات</button>
</nav>

<script>
let coins = Number(localStorage.getItem('coins') || 500);
let requests = JSON.parse(localStorage.getItem('requests') || '[]');

function updateCoins() {
  document.getElementById('coins').textContent = coins;
  localStorage.setItem('coins', coins);
}
function show(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function play() {
  const answer = prompt('حاصل ۷ + ۵ چند می‌شود؟');
  if (answer === null) return;
  if (Number(answer) === 12) {
    coins += 20;
    updateCoins();
    document.getElementById('gameResult').textContent =
      'آفرین! ۲۰ سکه گرفتی 🎉';
  } else {
    document.getElementById('gameResult').textContent =
      'جواب درست ۱۲ بود؛ دوباره تلاش کن!';
  }
}
function saveProfile() {
  const first = document.getElementById('first').value.trim();
  if (!first) {
    document.getElementById('profileResult').textContent =
      'نام اجباری است.';
    return;
  }
  localStorage.setItem('first', first);
  localStorage.setItem('last', document.getElementById('last').value.trim());
  localStorage.setItem('rubika', document.getElementById('rubika').value.trim());
  document.getElementById('profileResult').textContent = 'پروفایل ذخیره شد.';
  document.getElementById('summary').textContent =
    first + ' ' + localStorage.getItem('last') +
    ' — روبیکا: ' + (localStorage.getItem('rubika') || 'ثبت نشده');
}
function buy(gems, cost) {
  if (!localStorage.getItem('first')) {
    document.getElementById('shopResult').textContent =
      'ابتدا در بخش پشتیبانی پروفایلت را ذخیره کن.';
    return;
  }
  if (coins < cost) {
    document.getElementById('shopResult').textContent = 'سکه کافی نداری.';
    return;
  }
  if (!confirm('خرید ' + gems + ' جم با ' + cost + ' سکه؟')) return;
  coins -= cost;
  updateCoins();
  addRequest('خرید ' + gems + ' جم', 'هزینه: ' + cost + ' سکه');
  document.getElementById('shopResult').textContent =
    'درخواست شما به تیم پشتیبانی ارسال شد. جواب پیام در روبیکا به آیدی شما ارسال می‌شود. (در این نسخه فقط محلی ذخیره شده است.)';
}
function addRequest(kind, details) {
  requests.push({
    name: localStorage.getItem('first'),
    last: localStorage.getItem('last') || '',
    rubika: localStorage.getItem('rubika') || '',
    kind, details, date: new Date().toLocaleString('fa-IR')
  });
  localStorage.setItem('requests', JSON.stringify(requests));
}
function sendRequest() {
  if (!localStorage.getItem('first')) {
    document.getElementById('requestResult').textContent =
      'ابتدا پروفایل را ذخیره کن.';
    return;
  }
  addRequest(document.getElementById('kind').value,
             document.getElementById('details').value);
  document.getElementById('requestResult').textContent =
    'درخواست در این مرورگر ثبت شد؛ هنوز به تیم ارسال نشده است.';
}
function adminLogin() {
  if (document.getElementById('password').value !== 'Arshiya1392') {
    document.getElementById('adminResult').textContent = 'رمز اشتباه است.';
    return;
  }
  document.getElementById('adminResult').textContent =
    'ورود آزمایشی موفق بود. درخواست‌های همین مرورگر:';
  document.getElementById('inbox').innerHTML = requests.map(r =>
    '<div class="card"><b>' + safe(r.name) + ' ' + safe(r.last) +
    '</b><p>روبیکا: ' + safe(r.rubika) +
    '</p><p>نوع: ' + safe(r.kind) +
    '</p><p>' + safe(r.details) + '</p></div>'
  ).join('') || 'هنوز درخواستی ثبت نشده است.';
}
function safe(s) {
  return String(s || '').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
updateCoins();
</script>
</body>
</html>
</html
